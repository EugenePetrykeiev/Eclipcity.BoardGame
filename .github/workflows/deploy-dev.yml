name: Deploy dev

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/deploy-dev.yml
      - cicd/**
      - docker/**
      - migrations/**
      - public/**
      - src/**
      - tests/**
      - Dockerfile.backend
      - Dockerfile.deploy
      - Dockerfile.frontend
      - Dockerfile.nginx
      - alembic.ini
      - index.html
      - package-lock.json
      - package.json
      - vite.config.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eclipcity-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "396287094980"
  ECR_PREFIX: 396287094980.dkr.ecr.eu-central-1.amazonaws.com/eclipcity/dev
  RELEASE_ID: git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  ci:
    name: Validate application
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and publish ARM64 images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      nginx_image: ${{ steps.images.outputs.nginx_image }}
      deploy_image: ${{ steps.images.outputs.deploy_image }}
      release_id: ${{ steps.images.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS build role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::396287094980:role/eclipcity-dev-github-build
          role-session-name: github-build-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_PREFIX }}/backend:${{ env.RELEASE_ID }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
          provenance: mode=max
          sbom: true

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_PREFIX }}/frontend:${{ env.RELEASE_ID }}
          build-args: VITE_API_BASE_URL=/api
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64
          provenance: mode=max
          sbom: true

      - name: Build and push nginx
        id: nginx
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.nginx
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_PREFIX }}/nginx:${{ env.RELEASE_ID }}
          cache-from: type=gha,scope=nginx-arm64
          cache-to: type=gha,mode=max,scope=nginx-arm64
          provenance: mode=max
          sbom: true

      - name: Build and push deployment bundle
        id: deploy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_PREFIX }}/deploy:${{ env.RELEASE_ID }}
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,mode=max,scope=deploy-arm64
          provenance: mode=max
          sbom: true

      - name: Export immutable image URIs
        id: images
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          NGINX_DIGEST: ${{ steps.nginx.outputs.digest }}
          DEPLOY_DIGEST: ${{ steps.deploy.outputs.digest }}
        run: |
          {
            echo "backend_image=${ECR_PREFIX}/backend@${BACKEND_DIGEST}"
            echo "frontend_image=${ECR_PREFIX}/frontend@${FRONTEND_DIGEST}"
            echo "nginx_image=${ECR_PREFIX}/nginx@${NGINX_DIGEST}"
            echo "deploy_image=${ECR_PREFIX}/deploy@${DEPLOY_DIGEST}"
            echo "release_id=${RELEASE_ID}"
          } >> "${GITHUB_OUTPUT}"

  deploy-backend:
    name: Deploy backend and migrate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS backend deploy role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::396287094980:role/eclipcity-dev-github-deploy-backend
          role-session-name: github-backend-${{ github.run_id }}

      - name: Deploy backend through SSM
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          DEPLOY_IMAGE: ${{ needs.build.outputs.deploy_image }}
          DEPLOY_RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: >-
          ./cicd/scripts/run-ssm-deploy.sh backend
          "${BACKEND_IMAGE}" "${DEPLOY_IMAGE}" "${DEPLOY_RELEASE_ID}"

  deploy-frontend:
    name: Deploy frontend and nginx
    needs:
      - build
      - deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS frontend deploy role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::396287094980:role/eclipcity-dev-github-deploy-frontend
          role-session-name: github-frontend-${{ github.run_id }}

      - name: Deploy frontend through SSM
        env:
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          NGINX_IMAGE: ${{ needs.build.outputs.nginx_image }}
          DEPLOY_IMAGE: ${{ needs.build.outputs.deploy_image }}
          DEPLOY_RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: >-
          ./cicd/scripts/run-ssm-deploy.sh frontend
          "${FRONTEND_IMAGE}" "${NGINX_IMAGE}" "${DEPLOY_IMAGE}" "${DEPLOY_RELEASE_ID}"

  smoke-test:
    name: Verify public dev service
    needs: deploy-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check frontend and proxied backend readiness
        env:
          BASE_URL: http://dev.eclipcity.digitee.space
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${BASE_URL}/healthz" >/dev/null \
              && curl --fail --silent --show-error "${BASE_URL}/api/ready" >/dev/null; then
              echo "Dev release is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Dev release failed public smoke checks." >&2
          exit 1
