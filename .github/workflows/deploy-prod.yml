name: Promote and deploy prod

on:
  workflow_dispatch:
    inputs:
      dev_release_id:
        description: Successful dev release ID (git-<sha>-<run_id>-<attempt>)
        required: true
        type: string
      confirm_domain:
        description: Type eclipcity.digitee.space to confirm the production target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eclipcity-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "396287094980"
  DEV_ECR_PREFIX: 396287094980.dkr.ecr.eu-central-1.amazonaws.com/eclipcity/dev
  PROD_ECR_PREFIX: 396287094980.dkr.ecr.eu-central-1.amazonaws.com/eclipcity/prod
  ENVIRONMENT: prod
  SSM_DEPLOY_TIMEOUT_SECONDS: "1800"

jobs:
  release:
    name: Approve, promote, blue-green deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify successful dev deployment
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RELEASE_ID: ${{ inputs.dev_release_id }}
          CONFIRM_DOMAIN: ${{ inputs.confirm_domain }}
        run: |
          if [[ "${CONFIRM_DOMAIN}" != "eclipcity.digitee.space" ]]; then
            echo "Production domain confirmation does not match." >&2
            exit 2
          fi

          if [[ ! "${DEV_RELEASE_ID}" =~ ^git-([0-9a-f]{40})-([0-9]+)-([0-9]+)$ ]]; then
            echo "dev_release_id must use git-<40-char-sha>-<run_id>-<attempt>." >&2
            exit 2
          fi

          expected_sha="${BASH_REMATCH[1]}"
          run_id="${BASH_REMATCH[2]}"
          expected_attempt="${BASH_REMATCH[3]}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"

          jq -e \
            --arg sha "${expected_sha}" \
            --argjson attempt "${expected_attempt}" '
              .name == "Deploy dev"
              and .conclusion == "success"
              and .head_sha == $sha
              and .run_attempt == $attempt
            ' <<<"${run_json}" >/dev/null

          echo "release_id=${DEV_RELEASE_ID}" >>"${GITHUB_OUTPUT}"

      - name: Configure AWS promotion role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::396287094980:role/eclipcity-prod-github-promote
          role-session-name: github-promote-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Install registry promotion client
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Promote exact dev image digests
        id: images
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          components=(backend frontend nginx certbot deploy)

          for component in "${components[@]}"; do
            source_repository="eclipcity/dev/${component}"
            target_repository="eclipcity/prod/${component}"
            source_digest="$(
              aws ecr describe-images \
                --region "${AWS_REGION}" \
                --repository-name "${source_repository}" \
                --image-ids "imageTag=${RELEASE_ID}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"

            if [[ ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Missing immutable dev image for ${component}:${RELEASE_ID}." >&2
              exit 1
            fi

            existing_digest="$(
              aws ecr describe-images \
                --region "${AWS_REGION}" \
                --repository-name "${target_repository}" \
                --image-ids "imageTag=${RELEASE_ID}" \
                --query 'imageDetails[0].imageDigest' \
                --output text 2>/dev/null || true
            )"

            if [[ -n "${existing_digest}" && "${existing_digest}" != "None" ]]; then
              if [[ "${existing_digest}" != "${source_digest}" ]]; then
                echo "Immutable production tag collision for ${component}:${RELEASE_ID}." >&2
                exit 1
              fi
            else
              skopeo copy --all \
                "docker://${DEV_ECR_PREFIX}/${component}@${source_digest}" \
                "docker://${PROD_ECR_PREFIX}/${component}:${RELEASE_ID}"
            fi

            target_digest="$(
              aws ecr describe-images \
                --region "${AWS_REGION}" \
                --repository-name "${target_repository}" \
                --image-ids "imageTag=${RELEASE_ID}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"
            if [[ "${target_digest}" != "${source_digest}" ]]; then
              echo "Digest changed while promoting ${component}." >&2
              exit 1
            fi

            echo "${component}_image=${PROD_ECR_PREFIX}/${component}@${target_digest}" >>"${GITHUB_OUTPUT}"
          done

      - name: Configure AWS backend deploy role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::396287094980:role/eclipcity-prod-github-deploy-backend
          role-session-name: github-prod-backend-${{ github.run_id }}

      - name: Blue-green deploy backend and migrate
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          NGINX_IMAGE: ${{ steps.images.outputs.nginx_image }}
          DEPLOY_IMAGE: ${{ steps.images.outputs.deploy_image }}
          DEPLOY_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: >-
          ./cicd/scripts/run-ssm-deploy.sh backend
          "${BACKEND_IMAGE}" "${NGINX_IMAGE}" "${DEPLOY_IMAGE}" "${DEPLOY_RELEASE_ID}"

      - name: Configure AWS frontend deploy role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::396287094980:role/eclipcity-prod-github-deploy-frontend
          role-session-name: github-prod-frontend-${{ github.run_id }}

      - name: Blue-green deploy frontend and edge
        env:
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          NGINX_IMAGE: ${{ steps.images.outputs.nginx_image }}
          CERTBOT_IMAGE: ${{ steps.images.outputs.certbot_image }}
          DEPLOY_IMAGE: ${{ steps.images.outputs.deploy_image }}
          DEPLOY_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: >-
          ./cicd/scripts/run-ssm-deploy.sh frontend
          "${FRONTEND_IMAGE}" "${NGINX_IMAGE}" "${CERTBOT_IMAGE}"
          "${DEPLOY_IMAGE}" "${DEPLOY_RELEASE_ID}"

      - name: Verify production service
        env:
          BASE_URL: https://eclipcity.digitee.space
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${BASE_URL}/healthz" >/dev/null \
              && curl --fail --silent --show-error "${BASE_URL}/api/ready" >/dev/null; then
              echo "Production release is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Production release failed public smoke checks." >&2
          exit 1
