name: eclipcity-frontend

x-frontend-common: &frontend-common
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  healthcheck: &frontend-healthcheck
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/index.html >/dev/null || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  restart: unless-stopped
  networks:
    - frontend

services:
  frontend-blue:
    <<: *frontend-common
    image: ${FRONTEND_BLUE_IMAGE:?FRONTEND_BLUE_IMAGE must be an immutable ECR digest}

  frontend-green:
    <<: *frontend-common
    image: ${FRONTEND_GREEN_IMAGE:?FRONTEND_GREEN_IMAGE must be an immutable ECR digest}

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be an immutable ECR digest}
    environment:
      NGINX_HTTP_PORT: "8080"
      NGINX_HTTPS_LISTEN: ""
      NGINX_HTTP2_DIRECTIVE: ""
      NGINX_SERVER_NAME: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      NGINX_SSL_CERTIFICATE: ""
      NGINX_SSL_CERTIFICATE_KEY: ""
      NGINX_HTTP_REDIRECT: ""
      FRONTEND_UPSTREAM: ${FRONTEND_ACTIVE_SERVICE:?FRONTEND_ACTIVE_SERVICE is required}:8080
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?BACKEND_UPSTREAM is required}
    ports:
      - "80:8080"
    volumes:
      - /opt/eclipcity/frontend/frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-runtime:/var/run/certbot:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
    driver: bridge

volumes:
  certbot-config:
  certbot-webroot:
  certbot-runtime:
